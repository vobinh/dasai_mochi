<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTF → GFX (.h) theo từ/chuỗi – nhẹ tối đa</title>
  <style>
    body{margin:0;background:#0b0e11;color:#e7eaf1;font:14px/1.35 system-ui,Segoe UI,Roboto}
    .wrap{max-width:1200px;margin:24px auto;padding:0 16px}
    h1{font-size:20px}
    .card{background:#131820;border:1px solid #1f2630;border-radius:14px;padding:16px;margin:12px 0}
    label{display:block;margin:8px 0 6px;color:#9aa4b2}
    input,textarea{width:100%;background:#0f141b;color:#e7eaf1;border:1px solid #222b36;border-radius:10px;padding:10px}
    textarea{min-height:90px}
    button{margin-top:10px;padding:10px 14px;border-radius:10px;cursor:pointer}
    .mono{font-family:ui-monospace,monospace;white-space:pre}
    canvas{background:#0b0e11;border:1px dashed #2a3344;border-radius:8px}
    .hint{color:#9aa4b2;font-size:12px}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>TTF → GFX (.h) theo <em>từ/chuỗi</em></h1>
    <div class="card">
      <label>Font TTF/OTF</label>
      <input id="fontFile" type="file" accept=".ttf,.otf" />
      <div id="fontInfo" class="hint">Chưa chọn font…</div>

      <label>Cỡ chữ (px)</label>
      <input id="fontSize" type="number" value="32" min="6" max="200" />

      <label>Tên bộ font (.h)</label>
      <input id="familyName" type="text" placeholder="MyFont24" value="MyFont24" />

      <label>Danh sách TỪ/CHUỖI (phân tách bằng dấu phẩy hoặc xuống dòng)</label>
      <textarea id="words" placeholder="Ví dụ: 0123456789"></textarea>

      <button id="btnExtract">1) Phân tích & xem trước</button>
      <button id="btnDownload" disabled>2) Tải .h</button>
      <div id="stat" class="hint"></div>
    </div>

    <div class="card">
      <h3>Xem trước glyph (opentype.js)</h3>
      <canvas id="preview" width="600" height="240"></canvas>
      <label>Mã nguồn .h (rút gọn)</label>
      <textarea id="headerOut" class="mono" style="min-height:220px"></textarea>
    </div>
  </div>

<script>
let font; let lastResult=null;
const $=id=>document.getElementById(id);

$('fontFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const buf=await f.arrayBuffer();
  font=opentype.parse(buf);
  $('fontInfo').textContent=font.names.fullName?.en||f.name;
});

$('btnExtract').addEventListener('click',()=>{
  if(!font){alert('Chưa chọn font');return;}
  const px=parseInt($('fontSize').value||'24',10);
  const wordsRaw=$('words').value.trim();
  const chars=new Set(); for(const ch of wordsRaw) if(ch!=='\r'&&ch!=='\n'&&ch!==',') chars.add(ch);
  const res=buildGFX(font,px,[...chars].sort((a,b)=>a.codePointAt(0)-b.codePointAt(0)),$('familyName').value||'MyFont'+px);
  lastResult=res;
  $('headerOut').value=res.header.slice(0,5000)+(res.header.length>5000?"\n... (rút gọn)":'');
  $('btnDownload').disabled=false;
  drawPreview(res,px);
  $('stat').textContent=`Ký tự: ${res.chars.length} | Header: ${res.header.length} B | yAdvance=${res.lineHeight}`;
});

$('btnDownload').addEventListener('click',()=>{if(!lastResult)return;downloadText(lastResult.headerFileName,lastResult.header);});

function buildGFX(font,px,chars,family){
  const scale=px/font.unitsPerEm; 
  const ascent=Math.round(font.ascender*scale);
  const descent=Math.round(-font.descender*scale);
  const lineHeight=ascent+descent; // giống truetype2gfx

  const cvs=document.createElement('canvas'); const ctx=cvs.getContext('2d');
  const glyphs=[]; const bitmaps=[]; let bitmapOffset=0;
  for(const ch of chars){
    const g=font.charToGlyph(ch);
    const gWidth=Math.ceil((g.xMax-g.xMin)*scale)+2; 
    const gHeight=lineHeight+4; 
    cvs.width=gWidth; cvs.height=gHeight; 
    ctx.clearRect(0,0,cvs.width,cvs.height); 
    ctx.fillStyle='#fff'; 
    const x=Math.round(-g.xMin*scale)+1; 
    const y=ascent+2; 
    g.getPath(x,y,px).draw(ctx); 
    const img=ctx.getImageData(0,0,cvs.width,cvs.height); 
    const mono=to1bpp(img); 
    bitmaps.push(mono); 
    glyphs.push({ch,w:cvs.width,h:cvs.height,xAdvance:Math.round(g.advanceWidth*scale),xOffset:0,yOffset:-ascent,bitmapOffset}); 
    bitmapOffset+=mono.length;
  }
  const bitmapAll=concatU8(bitmaps); 
  const header=emitHeader(family,px,chars,glyphs,bitmapAll,ascent,descent,lineHeight);
  return{header,headerFileName:family+'.h',chars,lineHeight};
}

function to1bpp(img){const{width:w,height:h,data}=img;const bytes=new Uint8Array(Math.ceil(w*h/8));let bit=0,byte=0,idx=0;for(let y=0;y<h;y++){for(let x=0;x<w;x++){const a=data[(y*w+x)*4+3];const on=a>128;byte=(byte<<1)|(on?1:0);bit++;if(bit===8){bytes[idx++]=byte;bit=0;byte=0;}}}if(bit>0){bytes[idx++]=byte<<(8-bit);}return bytes;}

function emitHeader(name,px,chars,glyphs,bitmapU8,ascent,descent,lineHeight){let out=`#pragma once\n#include <stdint.h>\n#include <pgmspace.h>\n#include <Adafruit_GFX.h>\n\n`;out+=`// Generated by tool — size ${px}px\n`;
  out+=`const uint8_t ${name}_Bitmaps[] PROGMEM={\n`+wrapArray([...bitmapU8])+`\n};\n\n`;
  out+=`const GFXglyph ${name}_Glyphs[] PROGMEM={\n`;for(let i=0;i<glyphs.length;i++){const g=glyphs[i];const cp=g.ch.codePointAt(0);out+=`  { ${g.bitmapOffset}, ${g.w}, ${g.h}, ${g.xAdvance}, ${g.xOffset}, ${g.yOffset} }, // '${g.ch}' 0x${cp.toString(16)}\n`;}
  out+=`};\n\nconst GFXfont ${name} PROGMEM={(uint8_t*)${name}_Bitmaps,(GFXglyph*)${name}_Glyphs,0x${chars[0].codePointAt(0).toString(16)},0x${chars[chars.length-1].codePointAt(0).toString(16)},${lineHeight}};\n`;
  return out;}

function wrapArray(arr){const per=16;let out='  ';for(let i=0;i<arr.length;i++){out+='0x'+arr[i].toString(16).toUpperCase().padStart(2,'0');out+=(i<arr.length-1?', ':'');if((i+1)%per===0)out+='\n  ';}return out;}
function concatU8(chunks){let total=0;for(const c of chunks)total+=c.length;const out=new Uint8Array(total);let o=0;for(const c of chunks){out.set(c,o);o+=c.length;}return out;}
function downloadText(filename,text){const blob=new Blob([text],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);}

function drawPreview(res,px){const cvs=$('preview');const ctx=cvs.getContext('2d');ctx.clearRect(0,0,cvs.width,cvs.height);ctx.fillStyle='#0c1118';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.fillStyle='#61dafb';let x=20,y=120;for(const ch of res.chars){const g=font.charToGlyph(ch);const path=g.getPath(x,y,px);path.draw(ctx);x+=g.advanceWidth*(px/font.unitsPerEm)+5;}}
</script>
</body>
</html>
